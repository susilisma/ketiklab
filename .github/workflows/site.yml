name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      count:
        description: "Words to promote on this manual run (large = flush the whole queue)"
        default: "999"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.gate.outputs.go }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Strip filler example sentences
        id: filler
        # One-off migration: append-batch.mjs used to invent an example for every
        # word without one, and the entries already written still carry it. Runs on
        # every event and is a no-op once clean. Delete this step once it reports so.
        run: |
          node scripts/strip-placeholder-examples.mjs --write
          if git diff --quiet -- public/data/words.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "ketiklab-bot"
          git config user.email "bot@users.noreply.github.com"
          git add public/data/words.json
          git commit -m "content: strip the filler example sentences"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Promote queued content (hourly + manual runs)
        id: promote
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          # Only a manual run pins a fixed count. Scheduled runs leave this empty and
          # release by elapsed time, because GitHub delivers cron events irregularly.
          WORDS_PER_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.count || '' }}
        run: node scripts/promote.mjs
      - name: Snapshot library size for the ops dashboard
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && steps.promote.outputs.changed == 'true'
        run: python3 scripts/snapshot-history.py
      - name: Push promoted content
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && steps.promote.outputs.changed == 'true'
        run: |
          git config user.name "ketiklab-bot"
          git config user.email "bot@users.noreply.github.com"
          git add public/data queue
          git commit -m "chore(content): hourly auto-update" || echo "nothing to commit"
          git push
      - name: Decide whether to deploy
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ steps.promote.outputs.changed }}" != "true" ] && [ "${{ steps.filler.outputs.changed }}" != "true" ]; then
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install
        if: steps.gate.outputs.go == 'true'
        run: npm ci || npm install
      - name: Build
        if: steps.gate.outputs.go == 'true'
        run: npm run build
      - uses: actions/configure-pages@v5
        if: steps.gate.outputs.go == 'true'
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        if: steps.gate.outputs.go == 'true'
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.go == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

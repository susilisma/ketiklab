name: Rebuild Chinese word libraries

# Regenerates public/data/zh-*.json (plus the pinyin ladder map and the
# manifest) from openly-licensed sources. Run manually whenever
# scripts/build-zh-dicts.py changes.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-zh-dicts
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache wordnet data
        uses: actions/cache@v4
        with:
          path: ~/.wn_data
          key: wn-oewn2024-cmn14-id14
      - name: Install generator dependencies
        run: pip install wn wordfreq pypinyin
      - name: Download open wordnets
        run: |
          python -m wn download oewn:2024 || true
          python -m wn download omw-cmn:1.4 || true
          python -m wn download omw-id:1.4 || true
      - name: Build libraries
        run: python scripts/build-zh-dicts.py
      - name: Commit
        run: |
          git config user.name "ketiklab-bot"
          git config user.email "bot@users.noreply.github.com"
          git add public/data
          git commit -m "chore(data): rebuild Chinese libraries from open sources" || echo "nothing to commit"
          git push

name: Rebuild Chinese word libraries

# Regenerates public/data/zh-*.json (plus the pinyin ladder map and the
# manifest) from openly-licensed sources. Run manually whenever
# scripts/build-zh-dicts.py changes.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-zh-dicts
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Cache wordnet data
        uses: actions/cache@v5
        with:
          path: ~/.wn_data
          key: wn-oewn2024-cmn14-id14
      - name: Install generator dependencies
        run: pip install wn wordfreq pypinyin
      - name: Download open wordnets
        run: |
          python -m wn download oewn:2024 || true
          python -m wn download omw-cmn:1.4 || true
          python -m wn download omw-id:1.4 || true
      - name: Build and commit the libraries
        run: |
          git config user.name "ketiklab-bot"
          git config user.email "bot@users.noreply.github.com"
          # main may have moved during the minutes the build takes. A rejected push
          # rebuilds on the new tip, because the manifest is merged into it, rather
          # than failing with the regenerated libraries thrown away.
          for attempt in 1 2 3 4 5; do
            python scripts/build-zh-dicts.py
            git add public/data
            git commit -m "chore(data): rebuild Chinese libraries from open sources" || echo "nothing to commit"
            git push && exit 0
            sleep $((attempt * 10))
            git fetch origin main
            git reset --hard origin/main
          done
          exit 1

name: Daily word batch

# Generates ~100 fresh trilingual words a day into queue/words.json.
# The hourly "Build and deploy" run drains the queue into public/data/words.json.
# Dedup is against the live library + the current queue, so runs never repeat.

on:
  schedule:
    - cron: "20 21 * * *"   # 04:20 WIB
  workflow_dispatch:
    inputs:
      count:
        description: "How many new words to generate"
        default: "100"

permissions:
  contents: write

concurrency:
  group: daily-words
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Cache wordnet data
        uses: actions/cache@v5
        with:
          path: ~/.wn_data
          key: wn-oewn2024-cmn14-id14
      - name: Install dependencies
        run: pip install wn wordfreq cmudict pypinyin
      - name: Download open wordnets
        run: |
          python -m wn download oewn:2024 || true
          python -m wn download omw-cmn:1.4 || true
          python -m wn download omw-id:1.4 || true
      - name: Generate and commit the batch
        env:
          WORDS: ${{ inputs.count || '100' }}
        run: |
          git config user.name "ketiklab-bot"
          git config user.email "bot@users.noreply.github.com"
          # main may have moved since checkout (hourly promotions land here often).
          # A rejected push regenerates on the new tip, because the batch is
          # de-duplicated against it, rather than failing with the day's words lost.
          for attempt in 1 2 3 4 5; do
            python scripts/build-trio-queue.py
            git add queue/words.json
            if git diff --cached --quiet; then
              echo "nothing new"
              exit 0
            fi
            git commit -m "chore(content): daily word batch"
            git push && exit 0
            sleep $((attempt * 10))
            git fetch origin main
            git reset --hard origin/main
          done
          exit 1

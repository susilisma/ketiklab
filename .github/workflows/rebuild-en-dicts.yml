name: Rebuild English word libraries

# Regenerates public/data/en-*.json from openly-licensed sources.
# Run manually whenever scripts/build-en-dicts.py or the business gloss table changes.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-en-dicts
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install generator dependencies
        run: pip install wn wordfreq cmudict
      - name: Download open wordnets
        run: |
          python -m wn download oewn:2024
          python -m wn download omw-cmn:1.4
          python -m wn download omw-id:1.4
      - name: Build and commit the libraries
        run: |
          git config user.name "ketiklab-bot"
          git config user.email "bot@users.noreply.github.com"
          # main may have moved during the minutes the build takes. A rejected push
          # rebuilds on the new tip, because the manifest is merged into it, rather
          # than failing with the regenerated libraries thrown away.
          for attempt in 1 2 3 4 5; do
            python scripts/build-en-dicts.py
            # retired exam-branded libraries
            rm -f public/data/cet4.json public/data/cet6.json \
                  public/data/ielts.json public/data/toefl.json public/data/bec.json
            git add public/data
            git commit -m "chore(data): rebuild English libraries from open sources" || echo "nothing to commit"
            git push && exit 0
            sleep $((attempt * 10))
            git fetch origin main
            git reset --hard origin/main
          done
          exit 1

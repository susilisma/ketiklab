<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>KetikLab 运营看板</title>
<style>
.viz-root{
  color-scheme: light;
  --bg:#f4f4f2; --surface-1:#fcfcfb; --line:#e4e3df;
  --text-primary:#0b0b0b; --text-secondary:#52514e; --text-muted:#7b7a76;
  --grid:#ecebe7;
  --series-1:#2a78d6; --series-2:#eb6834; --series-3:#1baf7a; --series-4:#eda100;
  --seq-250:#86b6ef; --seq-350:#5598e7; --seq-450:#2a78d6; --seq-600:#184f95;
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])) .viz-root{
    color-scheme: dark;
    --bg:#111110; --surface-1:#1a1a19; --line:#2e2e2b;
    --text-primary:#ffffff; --text-secondary:#c3c2b7; --text-muted:#94938b;
    --grid:#2a2a27;
    --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70; --series-4:#c98500;
    --seq-250:#184f95; --seq-350:#256abf; --seq-450:#3987e5; --seq-600:#86b6ef;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text-primary);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,"PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:34px 22px 64px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
h1{font-size:22px;margin:0;letter-spacing:-.3px}
.sub{color:var(--text-muted);font-size:12px;margin-top:3px}
.reload{border:1px solid var(--line);background:var(--surface-1);color:var(--text-primary);
  border-radius:10px;padding:8px 14px;font-size:12px;font-weight:650;cursor:pointer}
.reload:hover{border-color:var(--series-1);color:var(--series-1)}

.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.tile{background:var(--surface-1);border:1px solid var(--line);border-radius:15px;padding:16px 18px}
.tile small{display:block;color:var(--text-muted);font-size:11px;letter-spacing:.6px;text-transform:uppercase}
.tile b{display:block;font-size:29px;letter-spacing:-1px;margin-top:6px;font-variant-numeric:tabular-nums}
.tile em{font-style:normal;font-size:12px;color:var(--text-secondary)}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{background:var(--surface-1);border:1px solid var(--line);border-radius:16px;padding:20px 22px}
.card.wide{grid-column:1/-1}
.card h2{font-size:15px;margin:0 0 2px}
.card p.note{color:var(--text-muted);font-size:11.5px;margin:0 0 16px}
figure{margin:0}
figcaption{color:var(--text-muted);font-size:11px;margin-top:10px}

.legend{display:flex;gap:14px;flex-wrap:wrap;margin:0 0 12px;font-size:12px;color:var(--text-secondary)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

.bars{display:flex;flex-direction:column;gap:11px}
.bar-row{display:grid;grid-template-columns:104px 1fr 62px;align-items:center;gap:12px;font-size:12.5px}
.bar-row .track{display:block;height:14px;background:var(--grid);border-radius:4px;overflow:hidden}
.bar-row .fill{display:block;height:100%;border-radius:4px;transition:width .35s}
.bar-row .val{text-align:right;font-variant-numeric:tabular-nums;color:var(--text-secondary)}
.bar-row:hover .track{outline:2px solid var(--line);outline-offset:2px}

svg{display:block;width:100%;height:auto;overflow:visible}
.axis{fill:var(--text-muted);font-size:10px}
.gridline{stroke:var(--grid);stroke-width:1}
.line{fill:none;stroke:var(--series-1);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.dot{fill:var(--series-1);stroke:var(--surface-1);stroke-width:2}
.crosshair{stroke:var(--text-muted);stroke-width:1;stroke-dasharray:3 3;opacity:0}

.status-list{display:flex;flex-direction:column;gap:10px}
.status-item{display:grid;grid-template-columns:22px 1fr auto;gap:11px;align-items:center;
  border:1px solid var(--line);border-radius:11px;padding:11px 13px;font-size:13px}
.status-item i{font-style:normal;font-size:14px;text-align:center}
.status-item b{font-variant-numeric:tabular-nums;font-size:13px}
.status-item small{display:block;color:var(--text-muted);font-size:11px}

.seat-wrap{margin-top:6px}
.seat-track{height:16px;background:var(--grid);border-radius:5px;overflow:hidden}
.seat-fill{height:100%;background:var(--series-1);border-radius:5px}

details.table-view{margin-top:14px}
details.table-view summary{cursor:pointer;color:var(--text-secondary);font-size:11.5px}
table{border-collapse:collapse;width:100%;margin-top:10px}
th,td{border:1px solid var(--line);padding:6px 10px;font-size:12px;text-align:left}
th{color:var(--text-muted);font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.6px}
td:last-child,th:last-child{text-align:right;font-variant-numeric:tabular-nums}

#tip{position:fixed;pointer-events:none;opacity:0;transition:opacity .12s;z-index:9;
  background:var(--text-primary);color:var(--surface-1);border-radius:8px;padding:7px 10px;
  font-size:12px;white-space:nowrap;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.err{border:1px solid var(--critical);border-radius:12px;padding:14px 16px;color:var(--critical);font-size:13px}
@media(max-width:900px){.tiles{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}}
</style>
</head>
<body class="viz-root" data-palette="#2a78d6,#eb6834,#1baf7a,#eda100">
<div class="wrap">
  <header>
    <div>
      <h1>KetikLab 运营看板</h1>
      <div class="sub" id="sub">载入中…</div>
    </div>
    <button class="reload" id="reload">刷新数据</button>
  </header>

  <div id="fail"></div>

  <div class="tiles" id="tiles"></div>

  <div class="grid">
    <section class="card wide">
      <h2>词库增长</h2>
      <p class="note">每天累计词数。词库由 GitHub Actions 每日自动补给，队列按小时释放。</p>
      <figure id="growth"></figure>
    </section>

    <section class="card">
      <h2>分类分布</h2>
      <p class="note">四个学习分类的词条数量</p>
      <div class="legend" id="cat-legend"></div>
      <div class="bars" id="cat-bars"></div>
      <details class="table-view"><summary>以表格查看</summary><div id="cat-table"></div></details>
    </section>

    <section class="card">
      <h2>难度分布</h2>
      <p class="note">CEFR 等级，由英文词频推定</p>
      <div class="bars" id="lvl-bars"></div>
      <details class="table-view"><summary>以表格查看</summary><div id="lvl-table"></div></details>
    </section>

    <section class="card">
      <h2>词库规模</h2>
      <p class="note">各专项词库的词条数</p>
      <div class="bars" id="dict-bars"></div>
      <details class="table-view"><summary>以表格查看</summary><div id="dict-table"></div></details>
    </section>

    <section class="card">
      <h2>运营健康</h2>
      <p class="note">需要你处理的异常会在这里标红</p>
      <div class="status-list" id="health"></div>
    </section>

    <section class="card wide">
      <h2>创始会员席位</h2>
      <p class="note">数字来自 public/data/pay.json，卖出一席改一次即可</p>
      <div id="seats"></div>
    </section>
  </div>

  <p class="sub" style="margin-top:26px">
    数据实时取自 GitHub 仓库 <code>susilisma/ketiklab</code>，本页不存储任何数据，也不需要后端。
  </p>
</div>
<div id="tip"></div>

<script>
const RAW = "https://raw.githubusercontent.com/susilisma/ketiklab/main/";
const API = "https://api.github.com/repos/susilisma/ketiklab/";
const bust = () => "?t=" + Date.now();
const num = n => n.toLocaleString("zh-CN");

const CAT = [
  { key: "daily",     label: "日常",   color: "var(--series-1)" },
  { key: "business",  label: "商务",   color: "var(--series-2)" },
  { key: "indonesia", label: "印尼",   color: "var(--series-3)" },
  { key: "study",     label: "学术",   color: "var(--series-4)" },
];
const LVL = [
  { key: "A1", color: "var(--seq-250)" },
  { key: "A2", color: "var(--seq-350)" },
  { key: "B1", color: "var(--seq-450)" },
  { key: "B2", color: "var(--seq-600)" },
];

const tip = document.getElementById("tip");
function showTip(e, html) {
  tip.innerHTML = html;
  tip.style.opacity = "1";
  const pad = 14;
  let x = e.clientX + pad, y = e.clientY + pad;
  const r = tip.getBoundingClientRect();
  if (x + r.width > innerWidth - 8) x = e.clientX - r.width - pad;
  if (y + r.height > innerHeight - 8) y = e.clientY - r.height - pad;
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
const hideTip = () => { tip.style.opacity = "0"; };

function barRows(host, rows, total, fmt) {
  host.innerHTML = rows.map(r => `
    <div class="bar-row" data-tip="${r.label}：${num(r.value)}（${((r.value / total) * 100).toFixed(1)}%）">
      <span>${r.label}</span>
      <span class="track"><span class="fill" style="width:${(r.value / rows[0].value * 100).toFixed(1)}%;background:${r.color}"></span></span>
      <span class="val">${fmt ? fmt(r) : num(r.value)}</span>
    </div>`).join("");
  host.querySelectorAll(".bar-row").forEach(el => {
    el.addEventListener("mousemove", e => showTip(e, el.dataset.tip));
    el.addEventListener("mouseleave", hideTip);
  });
}

function table(host, head, rows) {
  host.innerHTML = `<table><thead><tr>${head.map(h => `<th>${h}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
}

/* ---------- growth line ---------- */
function growth(host, hist) {
  if (hist.length < 2) {
    host.innerHTML = `<p class="note">还需要至少两天的数据才能画出趋势。当前记录 ${hist.length} 天。</p>`;
    return;
  }
  const W = 900, H = 260, ml = 46, mr = 14, mt = 12, mb = 28;
  const xs = (i) => ml + (i / (hist.length - 1)) * (W - ml - mr);
  const lo = Math.min(...hist.map(d => d.words)), hi = Math.max(...hist.map(d => d.words));
  const pad = Math.max(20, (hi - lo) * 0.25);
  const y0 = Math.max(0, lo - pad), y1 = hi + pad;
  const ys = (v) => mt + (1 - (v - y0) / (y1 - y0)) * (H - mt - mb);

  const ticks = 4;
  let gridEls = "", labels = "";
  for (let i = 0; i <= ticks; i++) {
    const v = y0 + (i / ticks) * (y1 - y0), y = ys(v);
    gridEls += `<line class="gridline" x1="${ml}" x2="${W - mr}" y1="${y}" y2="${y}"/>`;
    labels += `<text class="axis" x="${ml - 8}" y="${y + 3}" text-anchor="end">${num(Math.round(v))}</text>`;
  }
  const path = hist.map((d, i) => `${i ? "L" : "M"}${xs(i)},${ys(d.words)}`).join(" ");
  const dots = hist.map((d, i) =>
    `<circle class="dot" cx="${xs(i)}" cy="${ys(d.words)}" r="4.5" data-i="${i}"/>`).join("");
  const xlab = hist.map((d, i) =>
    (i === 0 || i === hist.length - 1 || hist.length <= 8)
      ? `<text class="axis" x="${xs(i)}" y="${H - 8}" text-anchor="middle">${d.date.slice(5)}</text>` : "").join("");
  const last = hist[hist.length - 1];
  const label = `<text x="${xs(hist.length - 1) - 6}" y="${ys(last.words) - 12}" text-anchor="end"
      fill="var(--text-primary)" font-size="12" font-weight="700">${num(last.words)}</text>`;

  host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="词库累计词数随日期增长">
      ${gridEls}${labels}<path class="line" d="${path}"/>${dots}${xlab}${label}
      <line class="crosshair" id="ch" y1="${mt}" y2="${H - mb}"/>
    </svg>
    <figcaption>共 ${hist.length} 天记录，累计 ${num(last.words)} 词。</figcaption>`;

  const ch = host.querySelector("#ch");
  host.querySelectorAll(".dot").forEach(c => {
    c.addEventListener("mousemove", e => {
      const d = hist[+c.dataset.i], prev = hist[+c.dataset.i - 1];
      const delta = prev ? d.words - prev.words : 0;
      showTip(e, `${d.date}<br>${num(d.words)} 词${prev ? `　+${num(delta)}` : ""}`);
      ch.setAttribute("x1", c.getAttribute("cx")); ch.setAttribute("x2", c.getAttribute("cx"));
      ch.style.opacity = "1";
    });
    c.addEventListener("mouseleave", () => { hideTip(); ch.style.opacity = "0"; });
  });
}

/* ---------- health ---------- */
function health(host, items) {
  const ICON = { good: "●", warning: "▲", serious: "▲", critical: "■" };
  host.innerHTML = items.map(i => `
    <div class="status-item">
      <i style="color:var(--${i.state})" aria-hidden="true">${ICON[i.state]}</i>
      <div><b>${i.title}</b><small>${i.note}</small></div>
      <b style="color:var(--${i.state})">${i.value}</b>
    </div>`).join("");
}

/* ---------- load ---------- */
async function load() {
  const fail = document.getElementById("fail");
  fail.innerHTML = "";
  try {
    const j = (p) => fetch(RAW + p + bust()).then(r => { if (!r.ok) throw new Error(p); return r.json(); });
    const [words, queue, manifest, pay, hist] = await Promise.all([
      j("public/data/words.json"), j("queue/words.json"), j("public/data/manifest.json"),
      j("public/data/pay.json").catch(() => ({})), j("public/data/history.json").catch(() => []),
    ]);

    /* tiles */
    const today = hist.length ? hist[hist.length - 1] : { words: words.length };
    const prev = hist.length > 1 ? hist[hist.length - 2].words : null;
    const added = prev === null ? null : today.words - prev;
    const seats = pay.seatsTaken || 0, SEATS = 300, PRICE = 249000;
    document.getElementById("tiles").innerHTML = `
      <div class="tile"><small>总词条</small><b>${num(words.length)}</b><em>三语词库</em></div>
      <div class="tile"><small>昨日至今新增</small><b>${added === null ? "—" : "+" + num(added)}</b><em>目标 100 / 天</em></div>
      <div class="tile"><small>待发布队列</small><b>${num(queue.length)}</b><em>每小时释放 12 条</em></div>
      <div class="tile"><small>已售席位</small><b>${seats}<span style="font-size:15px;color:var(--text-muted)"> / ${SEATS}</span></b><em>Rp ${num(seats * PRICE)}</em></div>`;

    /* growth */
    growth(document.getElementById("growth"), hist);

    /* categories */
    const catCount = {};
    words.forEach(w => { catCount[w.category] = (catCount[w.category] || 0) + 1; });
    const catRows = CAT.map(c => ({ label: c.label, value: catCount[c.key] || 0, color: c.color }))
      .sort((a, b) => b.value - a.value);
    document.getElementById("cat-legend").innerHTML = CAT.map(c =>
      `<span><i style="background:${c.color}"></i>${c.label}</span>`).join("");
    barRows(document.getElementById("cat-bars"), catRows, words.length);
    table(document.getElementById("cat-table"), ["分类", "词条数", "占比"],
      catRows.map(r => [r.label, num(r.value), ((r.value / words.length) * 100).toFixed(1) + "%"]));

    /* levels */
    const lvlCount = {};
    words.forEach(w => { lvlCount[w.level] = (lvlCount[w.level] || 0) + 1; });
    const lvlRows = LVL.map(l => ({ label: l.key, value: lvlCount[l.key] || 0, color: l.color }));
    const lvlSorted = [...lvlRows].sort((a, b) => b.value - a.value);
    barRows(document.getElementById("lvl-bars"),
      lvlRows.map(r => ({ ...r })).sort((a, b) => b.value - a.value), words.length);
    table(document.getElementById("lvl-table"), ["等级", "词条数", "占比"],
      lvlSorted.map(r => [r.label, num(r.value), ((r.value / words.length) * 100).toFixed(1) + "%"]));

    /* dictionaries */
    const dictTotal = manifest.reduce((a, d) => a + d.length, 0);
    const dictRows = manifest.map(d => ({ label: d.name, value: d.length, color: "var(--series-1)" }))
      .sort((a, b) => b.value - a.value);
    barRows(document.getElementById("dict-bars"), dictRows, dictTotal);
    table(document.getElementById("dict-table"), ["词库", "词条数"], dictRows.map(r => [r.label, num(r.value)]));

    /* health */
    const badZh = words.filter(w => !/^[一-鿿；]+$/.test(String(w.zh))).length;
    let runState = { state: "warning", value: "未知", note: "无法读取 GitHub Actions 状态" };
    try {
      const runs = await fetch(API + "actions/workflows/daily-words.yml/runs?per_page=1").then(r => r.json());
      const r0 = runs.workflow_runs && runs.workflow_runs[0];
      if (r0) runState = r0.conclusion === "success"
        ? { state: "good", value: "成功", note: "最近一次运行 " + r0.created_at.slice(0, 16).replace("T", " ") }
        : { state: "critical", value: r0.conclusion || r0.status, note: "每日补给失败，词库会停止增长" };
    } catch { /* rate limited or offline */ }

    health(document.getElementById("health"), [
      { title: "每日补给任务", note: runState.note, value: runState.value, state: runState.state },
      {
        title: "队列深度", note: queue.length > 300 ? "堆积过多，发布速度跟不上生成速度" : "生成与发布节奏正常",
        value: num(queue.length), state: queue.length > 300 ? "warning" : "good",
      },
      {
        title: "不可输入词条", note: badZh ? "中文含非汉字字符，学员打不完会卡住" : "全部为纯汉字，可正常输入",
        value: num(badZh), state: badZh > 0 ? "serious" : "good",
      },
      {
        title: "收款配置", note: (pay.whatsapp || (pay.bank && pay.bank.account)) ? "收银台已开放" : "pay.json 未填，会员页仍显示“即将开放”",
        value: (pay.whatsapp || (pay.bank && pay.bank.account)) ? "已配置" : "未配置",
        state: (pay.whatsapp || (pay.bank && pay.bank.account)) ? "good" : "warning",
      },
    ]);

    /* seats */
    const pct = Math.min(100, (seats / SEATS) * 100);
    document.getElementById("seats").innerHTML = `
      <div class="seat-wrap">
        <div class="seat-track"><div class="seat-fill" style="width:${pct.toFixed(1)}%"></div></div>
        <p class="note" style="margin-top:9px">已售 ${seats} / ${SEATS} 席 · 剩余 ${SEATS - seats} 席 ·
           累计 Rp ${num(seats * PRICE)} · 售罄可得 Rp ${num(SEATS * PRICE)}</p>
      </div>`;

    document.getElementById("sub").textContent =
      "更新于 " + new Date().toLocaleString("zh-CN") + " · 数据源 GitHub main 分支";
  } catch (e) {
    fail.innerHTML = `<div class="err">读取数据失败：${e.message}。检查网络，或稍后再刷新。</div>`;
  }
}

document.getElementById("reload").addEventListener("click", load);
load();
</script>
</body>
</html>
